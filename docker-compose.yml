services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: ./app
    container_name: pyqt_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-app_db}
      APP_BRANCH_NAME: ${APP_BRANCH_NAME:-Главный филиал}
      APP_BRANCH_ADDRESS: ${APP_BRANCH_ADDRESS:-}
      APP_ADMIN_USER: ${APP_ADMIN_USER:?Set APP_ADMIN_USER in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_CASHIER_USER: ${APP_CASHIER_USER:?Set APP_CASHIER_USER in .env}
      APP_CASHIER_PASSWORD: ${APP_CASHIER_PASSWORD:?Set APP_CASHIER_PASSWORD in .env}
    volumes:
      - ./app:/app
    ports:
      - "127.0.0.1:6080:6080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: