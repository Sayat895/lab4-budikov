[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1280x800x24 -ac +extension GLX
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/sh -c "while [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; exec /usr/bin/x11vnc -display :0 -listen 127.0.0.1 -forever -shared -nopw -rfbport 5900"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=python /app/novnc_server.py
directory=/app
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:application]
command=python /app/main.py
directory=/app
environment=DISPLAY=":0",QT_X11_NO_MITSHM="1",LIBGL_ALWAYS_SOFTWARE="1",QT_DEBUG_PLUGINS="0",XDG_RUNTIME_DIR="/tmp/runtime-root"
autorestart=unexpected
exitcodes=0
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
